"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Arbitrary JSON data."
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JSON")

type Query {
    "Render a page for the resolved tenant site. Requires X-Forwarded-Host or Host header."
    renderPage(slug: String!): RenderPageResponse!
        @field(resolver: "App\\GraphQL\\Queries\\RenderPage")

    "List all licenses for the authenticated user."
    myLicenses: [License!]! @guard @field(resolver: "App\\GraphQL\\Queries\\MyLicenses")

    "Get a license by ID (site settings). Requires authentication."
    license(id: ID! @eq): License! @guard @find

    "List all pages for a license. Requires authentication."
    pages(licenseId: ID! @eq(key: "license_id")): [Page!]! @guard @all

    "Get a single page by license and page ID. Requires authentication."
    page(licenseId: ID! @eq(key: "license_id"), id: ID! @eq): Page! @guard @find

    "List components for a page. Requires authentication."
    pageComponents(licenseId: ID!, pageId: ID!): [PageComponent!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\PageComponents")

    "List available component types for a given template and page slug. Requires authentication."
    templateComponents(templateId: Int!, slug: String!): [TemplateComponent!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\TemplateComponents")

    "Найти компонент каталога по координатам (template + slug + type) — возвращает артикул."
    component(templateId: Int! @rename(attribute: "template_id"), slug: String!, type: String!): Component
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\FindComponent")

    "Список компонентов каталога, опционально по шаблону."
    components(templateId: Int @rename(attribute: "template_id")): [Component!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\Components")

    """
    Дизайн-системы, опционально относящиеся к шаблону.
    Для шаблона возвращаются заявленные для него системы плюс Базовая, если в ней
    ещё остались неприписанные версии компонентов этого шаблона.
    Это НЕ проверка готовности к выбору — см. isPublished на паре «система × шаблон».
    """
    designSystems(templateId: Int @rename(attribute: "template_id")): [DesignSystem!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\DesignSystems")

    "Find a rubric by its URL slug (public)."
    rubricBySlug(slug: String! @eq): Rubric @find

    "List all rubrics, sorted by sort_order (public)."
    rubrics(
        "Filter by active status."
        is_active: Boolean @eq
    ): [Rubric!]! @all @orderBy(column: "sort_order", direction: ASC)

    "Find a category by its URL slug (public)."
    categoryBySlug(slug: String! @eq): Category @find

    "List all categories, optionally filtered by rubric (public)."
    categories(
        "Filter by active status."
        is_active: Boolean @eq
        "Filter by rubric ID."
        rubric_id: ID @eq
    ): [Category!]! @all @orderBy(column: "sort_order", direction: ASC)

    "List mebel projects, optionally filtered by category (public)."
    mebelProjects(
        "Filter by active status."
        is_active: Boolean @eq
        "Filter by category ID."
        category_id: ID @eq
        "Filter by featured flag."
        is_featured: Boolean @eq
        "Filter by new flag."
        is_new: Boolean @eq
    ): [MebelProject!]! @all @orderBy(column: "sort_order", direction: ASC)

    "Get the authenticated user's wallet and transaction history. Requires authentication."
    myWallet: Wallet! @guard @field(resolver: "App\\GraphQL\\Queries\\MyWallet")

    "Get all invoices for the authenticated user (bank wire top-ups). Requires authentication."
    myInvoices: [Invoice!]!
        @guard
        @paginate(builder: "App\\GraphQL\\Queries\\MyInvoices@builder", defaultCount: 20, maxCount: 100)

    "List uploaded files in a bucket folder for the authenticated license. Requires authentication."
    listBucketFiles(
        "Folder prefix (e.g. 'bg'). Files are scoped to the user's license automatically."
        folder: String
        "Maximum number of keys to return (default 100, max 200)."
        maxKeys: Int
    ): [BucketFile!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ListBucketFiles")
}

type Mutation {
    "Create a new license for the authenticated user with the given template. Requires authentication."
    createLicense(
        templateId: Int! @rename(attribute: "template_id")
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreateLicense")

    "Update license site settings. Requires authentication."
    updateLicense(
        id: ID!
        domain: String
        faviconUrl: String @rename(attribute: "favicon_url")
        name: String
        metaDescription: String @rename(attribute: "meta_description")
        templateId: Int @rename(attribute: "template_id")
        headerData: JSON @rename(attribute: "header_data")
        footerData: JSON @rename(attribute: "footer_data")
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpdateLicense")

    "Create a new page. Requires authentication."
    createPage(
        licenseId: ID! @rename(attribute: "license_id")
        slug: String!
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreatePage")

    "Update an existing page. Requires authentication."
    updatePage(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
        slug: String
        seoTitle: String
            @rename(attribute: "seo_title")
            @rules(apply: ["nullable", "string", "max:255"])
        seoDescription: String
            @rename(attribute: "seo_description")
            @rules(apply: ["nullable", "string", "max:500"])
        seoKeywords: String
            @rename(attribute: "seo_keywords")
            @rules(apply: ["nullable", "string", "max:500"])
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpdatePage")

    "Delete a page. Requires authentication."
    deletePage(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\DeletePage")

    "Generate a pre-signed S3 upload URL. Requires authentication."
    generateUploadUrl(
        filename: String!
        mimeType: String!
        folder: String
        licenseId: ID
    ): UploadUrlResponse! @guard @field(resolver: "App\\GraphQL\\Mutations\\GenerateUploadUrl")

    "Create or update a page component. Requires authentication."
    upsertPageComponent(
        pageId: ID! @rename(attribute: "page_id")
        licenseId: ID! @rename(attribute: "license_id")
        type: String!
        data: JSON!
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpsertPageComponent")

    "Toggle the active state of a page component. Requires authentication."
    togglePageComponent(
        id: ID!
        isActive: Boolean! @rename(attribute: "is_active")
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\TogglePageComponent")

    "Delete a page component. Requires authentication."
    deletePageComponent(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\DeletePageComponent")

    "Cancel a license. Stops daily billing and deactivates the site. Requires authentication."
    cancelLicense(
        id: ID!
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\CancelLicense")

    "Create or update a Mebel Project. Requires authentication."
    upsertMebelProject(
        input: UpsertMebelProjectInput!
    ): MebelProject! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpsertMebelProject")

    """
    Создать онлайн-платёж для пополнения баланса (ЮKassa).
    Баланс не меняется до подтверждения оплаты провайдером.
    Клиента нужно перенаправить на confirmationUrl. Requires authentication.
    """
    createOnlinePayment(
        amount: String! @rules(
            apply: ["required", "numeric", "min:1", "max:1000000"]
            messages: [
                { rule: "numeric", message: "Сумма должна быть числом." }
                { rule: "min", message: "Минимальная сумма пополнения — 1 ₽." }
                { rule: "max", message: "Максимальная сумма пополнения — 1 000 000 ₽." }
            ]
        )
    ): OnlinePayment! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreateOnlinePayment")

    """
    Синхронизировать состояние онлайн-платежа с ЮKassa и зачислить деньги,
    если платёж оплачен. Вызывается при возврате пользователя со страницы
    оплаты; безопасна при повторных вызовах. Requires authentication.
    """
    syncOnlinePayment(
        id: ID!
    ): OnlinePayment! @guard @field(resolver: "App\\GraphQL\\Mutations\\SyncOnlinePayment")

    "Create a bank wire invoice for topping up the balance. Requires authentication."
    createInvoice(
        amount: String! @rules(
            apply: ["required", "numeric", "min:1", "max:1000000"]
            messages: [
                { rule: "numeric", message: "Сумма должна быть числом." }
                { rule: "min", message: "Минимальная сумма счёта — 1 ₽." }
                { rule: "max", message: "Максимальная сумма счёта — 1 000 000 ₽." }
            ]
        )
        companyName: String! @rules(
            apply: ["required", "string", "max:255"]
            messages: [
                { rule: "required", message: "Укажите наименование организации или ФИО." }
                { rule: "max", message: "Наименование не должно превышать 255 символов." }
            ]
        )
        "ИНН плательщика: 10 цифр для организации, 12 — для ИП или физлица."
        inn: String @rules(
            apply: ["nullable", "regex:/^\\d{10}(\\d{2})?$/"]
            messages: [
                { rule: "regex", message: "ИНН должен содержать 10 или 12 цифр." }
            ]
        )
    ): InvoiceResult! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreateInvoice")

    "Create a new service request from a public site."
    createServiceRequest(
        input: CreateServiceRequestInput!
    ): ServiceRequest! @field(resolver: "App\\GraphQL\\Mutations\\CreateServiceRequest")

    "Toggle the enabled state of a category. Requires authentication."
    toggleCategory(
        id: ID!
        isEnabled: Boolean! @rename(attribute: "is_enabled")
    ): Category! @guard @field(resolver: "App\\GraphQL\\Mutations\\ToggleCategory")

    "Зарегистрировать компонент в каталоге с авто-присвоением артикула. Requires authentication."
    createComponent(
        templateId: Int! @rename(attribute: "template_id")
        slug: String!
        type: String!
        name: String
        "Список версий компонента (1..N); по умолчанию [1]."
        variants: [Int!]
    ): Component! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreateComponent")
}

input UpsertMebelProjectInput {
    id: ID
    category_id: ID!
    value: String!
    description: String
    short_description: String
    price: Float
    old_price: Float
    is_featured: Boolean
    is_new: Boolean
    is_active: Boolean
    image_urls: [String!]
}

type Wallet {
    id: ID!
    userId: Int! @rename(attribute: "user_id")
    balance: String!
    transactions(
        orderBy: [OrderByClause!] @orderBy
    ): [Transaction!]! @paginate
}

type Transaction {
    id: ID!
    walletId: ID! @rename(attribute: "wallet_id")
    licenseId: ID @rename(attribute: "license_id")
    amount: String!
    type: String!
    description: String
    createdAt: DateTime @rename(attribute: "created_at")
}

"Онлайн-платёж для пополнения баланса через ЮKassa."
type OnlinePayment {
    id: ID!
    amount: String!
    "Статус платежа в ЮKassa: pending, waiting_for_capture, succeeded, canceled."
    status: String!
    "Ссылка на страницу оплаты. Заполнена только при создании платежа."
    confirmationUrl: String
    "Баланс кошелька после синхронизации. Заполнен только в syncOnlinePayment."
    balance: String
}

"A bank wire invoice created by the user for balance top-up."
type Invoice {
    id: ID!
    number: String!
    amount: String!
    status: String!
    companyName: String! @rename(attribute: "company_name")
    inn: String
    createdAt: DateTime @rename(attribute: "created_at")
}

type InvoiceResult {
    success: Boolean!
    invoice: Invoice!
}

input OrderByClause {
    column: String!
    order: SortOrder!
}

enum SortOrder {
    ASC
    DESC
}

type License {
    id: ID!
    userId: Int! @rename(attribute: "user_id")
    domain: String!
    faviconUrl: String @rename(attribute: "favicon_url")
    name: String
    metaDescription: String @rename(attribute: "meta_description")
    headerData: JSON @rename(attribute: "header_data")
    footerData: JSON @rename(attribute: "footer_data")
    templateId: Int @rename(attribute: "template_id")
    isActive: Boolean! @rename(attribute: "is_active")
    status: String!
    dailyPrice: Float @rename(attribute: "daily_price")
    billingStartedAt: DateTime @rename(attribute: "billing_started_at")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    pages: [Page!]! @hasMany
}

type Page {
    id: ID!
    licenseId: ID! @rename(attribute: "license_id")
    slug: String!
    seoTitle: String @rename(attribute: "seo_title")
    seoDescription: String @rename(attribute: "seo_description")
    seoKeywords: String @rename(attribute: "seo_keywords")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    license: License! @belongsTo
}

type RenderPageResponse {
    site: SiteSettings!
    page: PageContent!
}

type SiteSettings {
    name: String
    metaDescription: String
    templateId: Int
    faviconUrl: String
    "Владелец лицензии. Публичное поле: ответ renderPage кэшируется одним куском на всех, поэтому здесь id владельца, а не признак «это ты» — сверка идёт на клиенте."
    ownerId: ID
    header: SiteComponent
    footer: SiteComponent
}

"A site-wide component (header or footer) with arbitrary JSON data."
type SiteComponent {
    data: JSON!
}

type PageContent {
    slug: String!
    requestedSlug: String!
    id: ID
    licenseId: ID @rename(attribute: "license_id")
    componentsData: JSON
    seo: PageSeo!
}

"Resolved SEO metadata and the editable source values for a page."
type PageSeo {
    title: String
    description: String
    keywords: String
    rawTitle: String
    rawDescription: String
    isDynamic: Boolean!
    pattern: String!
    variables: [SeoVariable!]!
}

"A placeholder available in a dynamic page SEO template."
type SeoVariable {
    token: String!
    label: String!
    value: String!
}

type UploadUrlResponse {
    uploadUrl: String!
    objectUrl: String!
    expiresIn: Int!
}

"A single file object stored in the cloud bucket."
type BucketFile {
    "S3 object key (path within the bucket)."
    key: String!
    "Public URL of the file."
    url: String!
    "File size in bytes."
    size: Int
    "ISO 8601 timestamp of last modification."
    lastModified: String
}

"A single component type available for a template page."
type TemplateComponent {
    type: String!
    label: String!
}

type PageComponent {
    id: ID!
    pageId: ID! @rename(attribute: "page_id")
    licenseId: ID! @rename(attribute: "license_id")
    "Технический ключ каталога: поиск в шаблоне, пути к файлам и подпись блока в редакторе."
    type: String!
    data: JSON!
    isActive: Boolean! @rename(attribute: "is_active")
    sortOrder: Int! @rename(attribute: "sort_order")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

"Страница шаблона в каталоге (даёт странице порядковый номер артикула)."
type TemplatePage {
    id: ID!
    templateId: Int! @rename(attribute: "template_id")
    slug: String!
    pageNumber: Int! @rename(attribute: "page_number")
    name: String
    components: [Component!]! @hasMany
}

"Каталожный компонент (дизайн-блок шаблона). Групповой артикул = template.page.component."
type Component {
    id: ID!
    templateId: Int! @rename(attribute: "template_id")
    type: String!
    componentNumber: Int! @rename(attribute: "component_number")
    name: String
    isActive: Boolean! @rename(attribute: "is_active")
    "3-сегментный артикул «1.8.12»."
    article: String!
    page: TemplatePage @belongsTo
    variants: [ComponentVariant!]! @hasMany
}

"Версия компонента (v1…v4). Полный артикул «1.8.12.4»."
type ComponentVariant {
    id: ID!
    componentId: ID! @rename(attribute: "component_id")
    "Версия компонента: 1=v1 … 4=v4 (4-й сегмент артикула). Это НЕ цветовая схема."
    version: Int!
    name: String
    "4-сегментный артикул «1.8.12.4»."
    article: String!
    """
    Статус в жизненном цикле: draft | active | legacy.
    legacy означает «не предлагается в переключателе, но продолжает рендериться там,
    где уже выбрана» — вывод компонента не ломает существующие сайты.
    Независим от принадлежности дизайн-системе.
    """
    status: String!
    "Дизайн-системы, которым принадлежит версия (одна или несколько)."
    designSystems: [DesignSystem!]! @belongsToMany
}

"""
Дизайн-система: внешний вид, который шаблон сам по себе не задаёт.
Шаблон отвечает за структуру (страницы, блоки, форма данных), система — за палитру,
типографику, ритм и пластику блоков.
"""
type DesignSystem {
    id: ID!
    "Человекочитаемое имя, видит пользователь: «Ар-деко»."
    name: String!
    "Машинное имя: ar-deco."
    slug: String!
    description: String
    """
    Базовая система — песочница для легаси и версий в разработке. Ровно одна на всю
    платформу. Показывается пользователю с пометкой legacy, новым сайтам не предлагается,
    инвариант покрытия к ней не применяется, фолбэком она НЕ служит.
    """
    isBase: Boolean @rename(attribute: "is_base")
    """
    Заявленная область: для каких шаблонов система предназначена.
    Это НЕ фактическое покрытие — оно вычисляется по каталогу.
    У Базовой пусто: заявленной области у неё нет.
    """
    templates: [DesignSystemTemplate!]! @method(name: "templateScopes")
    "Версии компонентов, принадлежащие системе."
    variants: [ComponentVariant!]! @belongsToMany
}

"Пара «дизайн-система × шаблон»: заявленная область и готовность к выбору."
type DesignSystemTemplate {
    "Ключ config/templates.php: 1=Promo-1, 2=Promo-2, 3=Promo-3."
    templateId: Int! @rename(attribute: "template_id")
    """
    Пара готова к выбору пользователем. Проверка инварианта покрытия при выставлении
    флага пока НЕ реализована — значение выставляется вручную.
    """
    isPublished: Boolean! @rename(attribute: "is_published")
}

"A rubric (top-level catalog section, e.g. Mebel, Santehnika)."
type Rubric {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "Name of the rubric."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Description of the rubric."
    description: String

    "Whether the rubric is active."
    is_active: Boolean!

    "Sort order for display."
    sort_order: Int!

    "Categories belonging to this rubric."
    categories: [Category!]! @hasMany

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

"A category within a rubric (e.g. Kitchens, Wardrobes)."
type Category {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "ID of the parent rubric."
    rubric_id: ID

    "Parent rubric."
    rubric: Rubric @belongsTo

    "Name of the category."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Description of the category."
    description: String

    "Background color or image."
    bg: String

    "Whether the category is active."
    is_active: Boolean!

    "Whether the category is enabled in the catalog."
    is_enabled: Boolean!

    "Sort order for display."
    sort_order: Int!

    "Projects belonging to this category."
    mebelProjects: [MebelProject!]! @hasMany(relation: "mebelProjects")

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

"A furniture project (card in the catalog)."
type MebelProject {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "ID of the parent category."
    category_id: ID!

    "Parent category."
    category: Category @belongsTo

    "Name of the project."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Full description."
    description: String

    "Short description for cards."
    short_description: String

    "Price of the project."
    price: Float

    "Old price (for discounts)."
    old_price: Float

    "SEO title."
    seo_title: String

    "SEO description."
    seo_description: String

    "Arbitrary JSON meta-data."
    meta: JSON

    "Sort order for display."
    sort_order: Int!

    "Whether the project is featured."
    is_featured: Boolean!

    "Whether the project is a new item."
    is_new: Boolean!

    "Whether the project is active."
    is_active: Boolean!

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

"A service request submitted by a client/visitor."
type ServiceRequest {
    id: ID!
    service_type: String!
    name: String!
    phone: String!
    message: String
    status: String!
    ip_address: String
    user_agent: String
    source_url: String
    city: String
    created_at: DateTime
    updated_at: DateTime
}

"Input data for creating a service request."
input CreateServiceRequestInput {
    service_type: String! @rules(apply: ["required", "string", "max:50"])
    name: String! @rules(apply: ["required", "string", "max:255"])
    phone: String! @rules(apply: ["required", "string", "max:50"])
    message: String @rules(apply: ["nullable", "string", "max:2000"])
    source_url: String @rules(apply: ["nullable", "string", "max:500"])
    city: String @rules(apply: ["nullable", "string", "max:100"])
}
