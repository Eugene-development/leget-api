"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Arbitrary JSON data."
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JSON")

type Query {
    "Render a page for the resolved tenant site. Requires X-Forwarded-Host or Host header."
    renderPage(slug: String!): RenderPageResponse!
        @field(resolver: "App\\GraphQL\\Queries\\RenderPage")

    "List all licenses for the authenticated user."
    myLicenses: [License!]! @guard @field(resolver: "App\\GraphQL\\Queries\\MyLicenses")

    "Get a license by ID (site settings). Requires authentication."
    license(id: ID! @eq): License! @guard @find

    "List all pages for a license. Requires authentication."
    pages(licenseId: ID! @eq(key: "license_id")): [Page!]! @guard @all

    "Get a single page by license and page ID. Requires authentication."
    page(licenseId: ID! @eq(key: "license_id"), id: ID! @eq): Page! @guard @find

    "List components for a page. Requires authentication."
    pageComponents(licenseId: ID!, pageId: ID!): [PageComponent!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\PageComponents")

    "List available component types for a given template and page slug. Requires authentication."
    templateComponents(templateId: Int!, slug: String!): [TemplateComponent!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\TemplateComponents")

    "Find a rubric by its URL slug (public)."
    rubricBySlug(slug: String! @eq): Rubric @find

    "List all rubrics, sorted by sort_order (public)."
    rubrics(
        "Filter by active status."
        is_active: Boolean @eq
    ): [Rubric!]! @all @orderBy(column: "sort_order", direction: ASC)

    "Find a category by its URL slug (public)."
    categoryBySlug(slug: String! @eq): Category @find

    "List all categories, optionally filtered by rubric (public)."
    categories(
        "Filter by active status."
        is_active: Boolean @eq
        "Filter by rubric ID."
        rubric_id: ID @eq
    ): [Category!]! @all @orderBy(column: "sort_order", direction: ASC)

    "List mebel projects, optionally filtered by category (public)."
    mebelProjects(
        "Filter by active status."
        is_active: Boolean @eq
        "Filter by category ID."
        category_id: ID @eq
        "Filter by featured flag."
        is_featured: Boolean @eq
        "Filter by new flag."
        is_new: Boolean @eq
    ): [MebelProject!]! @all @orderBy(column: "sort_order", direction: ASC)

    "Get the authenticated user's wallet and transaction history. Requires authentication."
    myWallet: Wallet! @guard @field(resolver: "App\\GraphQL\\Queries\\MyWallet")
}

type Mutation {
    "Create a new license for the authenticated user with the given template. Requires authentication."
    createLicense(
        templateId: Int! @rename(attribute: "template_id")
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreateLicense")

    "Update license site settings. Requires authentication."
    updateLicense(
        id: ID!
        domain: String
        faviconUrl: String @rename(attribute: "favicon_url")
        name: String
        metaDescription: String @rename(attribute: "meta_description")
        templateId: Int @rename(attribute: "template_id")
        headerData: JSON @rename(attribute: "header_data")
        footerData: JSON @rename(attribute: "footer_data")
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpdateLicense")

    "Create a new page. Requires authentication."
    createPage(
        licenseId: ID! @rename(attribute: "license_id")
        slug: String!
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\CreatePage")

    "Update an existing page. Requires authentication."
    updatePage(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
        slug: String
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpdatePage")

    "Delete a page. Requires authentication."
    deletePage(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
    ): Page! @guard @field(resolver: "App\\GraphQL\\Mutations\\DeletePage")

    "Generate a pre-signed S3 upload URL. Requires authentication."
    generateUploadUrl(
        filename: String!
        mimeType: String!
        folder: String
    ): UploadUrlResponse! @guard @field(resolver: "App\\GraphQL\\Mutations\\GenerateUploadUrl")

    "Create or update a page component. Requires authentication."
    upsertPageComponent(
        pageId: ID! @rename(attribute: "page_id")
        licenseId: ID! @rename(attribute: "license_id")
        type: String!
        data: JSON!
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpsertPageComponent")

    "Toggle the active state of a page component. Requires authentication."
    togglePageComponent(
        id: ID!
        isActive: Boolean! @rename(attribute: "is_active")
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\TogglePageComponent")

    "Delete a page component. Requires authentication."
    deletePageComponent(
        id: ID!
        licenseId: ID! @rename(attribute: "license_id")
    ): PageComponent! @guard @field(resolver: "App\\GraphQL\\Mutations\\DeletePageComponent")

    "Cancel a license. Stops daily billing and deactivates the site. Requires authentication."
    cancelLicense(
        id: ID!
    ): License! @guard @field(resolver: "App\\GraphQL\\Mutations\\CancelLicense")

    "Create or update a Mebel Project. Requires authentication."
    upsertMebelProject(
        input: UpsertMebelProjectInput!
    ): MebelProject! @guard @field(resolver: "App\\GraphQL\\Mutations\\UpsertMebelProject")

    "Top up the user's wallet balance. Requires authentication."
    topUpBalance(
        amount: String!
    ): TopUpResult! @guard @field(resolver: "App\\GraphQL\\Mutations\\TopUpBalance")
}

input UpsertMebelProjectInput {
    id: ID
    category_id: ID!
    value: String!
    description: String
    short_description: String
    price: Float
    old_price: Float
    is_featured: Boolean
    is_new: Boolean
    is_active: Boolean
    image_urls: [String!]
}

type Wallet {
    id: ID!
    userId: Int! @rename(attribute: "user_id")
    balance: String!
    transactions(
        orderBy: [OrderByClause!] @orderBy
    ): [Transaction!]! @paginate
}

type Transaction {
    id: ID!
    walletId: ID! @rename(attribute: "wallet_id")
    licenseId: ID @rename(attribute: "license_id")
    amount: String!
    type: String!
    description: String
    createdAt: DateTime @rename(attribute: "created_at")
}

type TopUpResult {
    success: Boolean!
    newBalance: String!
    transaction: Transaction!
}

input OrderByClause {
    column: String!
    order: SortOrder!
}

enum SortOrder {
    ASC
    DESC
}

type License {
    id: ID!
    userId: Int! @rename(attribute: "user_id")
    domain: String!
    faviconUrl: String @rename(attribute: "favicon_url")
    name: String
    metaDescription: String @rename(attribute: "meta_description")
    headerData: JSON @rename(attribute: "header_data")
    footerData: JSON @rename(attribute: "footer_data")
    templateId: Int @rename(attribute: "template_id")
    isActive: Boolean! @rename(attribute: "is_active")
    status: String!
    dailyPrice: Float @rename(attribute: "daily_price")
    billingStartedAt: DateTime @rename(attribute: "billing_started_at")
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    pages: [Page!]! @hasMany
}

type Page {
    id: ID!
    licenseId: ID! @rename(attribute: "license_id")
    slug: String!
    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
    license: License! @belongsTo
}

type RenderPageResponse {
    site: SiteSettings!
    page: PageContent!
}

type SiteSettings {
    name: String
    metaDescription: String
    templateId: Int
    header: SiteComponent
    footer: SiteComponent
}

"A site-wide component (header or footer) with arbitrary JSON data."
type SiteComponent {
    data: JSON!
}

type PageContent {
    slug: String!
    id: ID
    licenseId: ID @rename(attribute: "license_id")
    componentsData: JSON
}

type UploadUrlResponse {
    uploadUrl: String!
    objectUrl: String!
    expiresIn: Int!
}

"A single component type available for a template page."
type TemplateComponent {
    type: String!
    label: String!
}

type PageComponent {
    id: ID!
    pageId: ID! @rename(attribute: "page_id")
    licenseId: ID! @rename(attribute: "license_id")
    type: String!
    data: JSON!
    isActive: Boolean! @rename(attribute: "is_active")
    sortOrder: Int! @rename(attribute: "sort_order")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

"A rubric (top-level catalog section, e.g. Mebel, Santehnika)."
type Rubric {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "Name of the rubric."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Description of the rubric."
    description: String

    "Whether the rubric is active."
    is_active: Boolean!

    "Sort order for display."
    sort_order: Int!

    "Categories belonging to this rubric."
    categories: [Category!]! @hasMany

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

"A category within a rubric (e.g. Kitchens, Wardrobes)."
type Category {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "ID of the parent rubric."
    rubric_id: ID

    "Parent rubric."
    rubric: Rubric @belongsTo

    "Name of the category."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Description of the category."
    description: String

    "Background color or image."
    bg: String

    "Whether the category is active."
    is_active: Boolean!

    "Sort order for display."
    sort_order: Int!

    "Projects belonging to this category."
    mebelProjects: [MebelProject!]! @hasMany(relation: "mebelProjects")

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

"A furniture project (card in the catalog)."
type MebelProject {
    "Unique ULID identifier."
    id: ID!

    "Unique key for external references."
    key: ID!

    "ID of the parent category."
    category_id: ID!

    "Parent category."
    category: Category @belongsTo

    "Name of the project."
    value: String!

    "URL-friendly slug."
    slug: String!

    "Full description."
    description: String

    "Short description for cards."
    short_description: String

    "Price of the project."
    price: Float

    "Old price (for discounts)."
    old_price: Float

    "SEO title."
    seo_title: String

    "SEO description."
    seo_description: String

    "Arbitrary JSON meta-data."
    meta: JSON

    "Sort order for display."
    sort_order: Int!

    "Whether the project is featured."
    is_featured: Boolean!

    "Whether the project is a new item."
    is_new: Boolean!

    "Whether the project is active."
    is_active: Boolean!

    createdAt: DateTime @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}
