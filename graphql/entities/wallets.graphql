extend type Query {
    "Get the authenticated user's wallet and transaction history. Requires authentication."
    myWallet: Wallet! @guard @field(resolver: "App\\GraphQL\\Queries\\MyWallet")
}

type Wallet {
    id: ID!
    userId: Int! @rename(attribute: "user_id")
    balance: String!
    transactions(
        type: String @rules(apply: ["nullable", "in:deposit,withdraw"])
        dateFrom: String @rules(apply: ["nullable", "date_format:Y-m-d"])
        dateTo: String @rules(apply: ["nullable", "date_format:Y-m-d"])
        orderBy: [OrderByClause!]
    ): [Transaction!]! @paginate(builder: "App\\GraphQL\\Queries\\WalletTransactions@builder", defaultCount: 20, maxCount: 200)
}

type Transaction {
    id: ID!
    walletId: ID! @rename(attribute: "wallet_id")
    licenseId: ID @rename(attribute: "license_id")
    amount: String!
    type: String!
    description: String
    createdAt: DateTime @rename(attribute: "created_at")
    occurredAt: String @rename(attribute: "occurred_at")
    billingDate: String @rename(attribute: "billing_date")
}
