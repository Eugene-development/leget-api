extend type Query {
    "List uploaded files in a bucket folder for the authenticated license. Requires authentication."
    listBucketFiles(
        "Folder prefix (e.g. 'bg'). Files are scoped to the user's license automatically."
        folder: String
        "Maximum number of keys to return (default 100, max 200)."
        maxKeys: Int
    ): [BucketFile!]! @guard @field(resolver: "App\\GraphQL\\Queries\\ListBucketFiles")
}

extend type Mutation {
    "Generate a pre-signed S3 upload URL. Requires authentication."
    generateUploadUrl(
        filename: String!
        mimeType: String!
        folder: String
        licenseId: ID
    ): UploadUrlResponse! @guard @field(resolver: "App\\GraphQL\\Mutations\\GenerateUploadUrl")
}

type UploadUrlResponse {
    uploadUrl: String!
    objectUrl: String!
    expiresIn: Int!
}

"A single file object stored in the cloud bucket."
type BucketFile {
    "S3 object key (path within the bucket)."
    key: String!
    "Public URL of the file."
    url: String!
    "File size in bytes."
    size: Int
    "ISO 8601 timestamp of last modification."
    lastModified: String
}
